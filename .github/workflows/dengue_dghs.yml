name: Update Dengue CSV

on:
  schedule:
    - cron: "0 11 * * *"      # 15:00 UTC = 17:00 Bangladesh time (after the press release is out)
  workflow_dispatch:
    inputs:
      from_date:
        description: "Backfill from (YYYY-MM-DD, optional)"
        required: false
      to_date:
        description: "Backfill to (YYYY-MM-DD, optional)"
        required: false

jobs:
  update-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download press releases and update Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GSHEET_JSON }}
          DAYS_BACK: "3"
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.from_date }}" ] && ARGS="$ARGS --from-date ${{ github.event.inputs.from_date }}"
          [ -n "${{ github.event.inputs.to_date }}" ] && ARGS="$ARGS --to-date ${{ github.event.inputs.to_date }}"
          python dengue_dghs_daily.py $ARGS
