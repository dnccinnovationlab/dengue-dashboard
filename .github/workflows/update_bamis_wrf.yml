name: Update BAMIS WRF Forecast

on:

  # Every day at 08:00 Bangladesh time
  # Bangladesh = UTC + 6
  # 08:00 BDT = 02:00 UTC

  schedule:
    - cron: "0 2 * * *"

  # Manual run
  workflow_dispatch:


jobs:

  update-bamis-wrf:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # SETUP R
      # ------------------------------------------------------

      - name: Setup R

        uses: r-lib/actions/setup-r@v2


      # ------------------------------------------------------
      # INSTALL PACKAGES
      # ------------------------------------------------------

      - name: Install R packages

        run: |

          Rscript -e '
          install.packages(
            c(
              "rvest",
              "dplyr",
              "stringr",
              "lubridate",
              "googlesheets4"
            ),
            repos = "https://cloud.r-project.org"
          )
          '


      # ------------------------------------------------------
      # RUN SCRAPER
      # ------------------------------------------------------

      - name: Run BAMIS WRF scraper

        env:

          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GSHEET_JSON }}

        run: |

          Rscript weather_daily_forecast_bamis.R
