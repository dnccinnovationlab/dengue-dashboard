name: Update BAMIS WRF Forecast
on:
  # Every day at 08:00 Bangladesh time
  # Bangladesh = UTC + 6
  # 08:00 BDT = 02:00 UTC
  schedule:
    - cron: "0 2 * * *"
  # Manual run
  workflow_dispatch:
jobs:
  update-bamis-wrf:
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
      # ------------------------------------------------------
      # SETUP R
      # ------------------------------------------------------
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
      # ------------------------------------------------------
      # INSTALL SYSTEM DEPENDENCIES FOR httr / curl
      # ------------------------------------------------------
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev
      # ------------------------------------------------------
      # INSTALL PACKAGES
      # ------------------------------------------------------
      - name: Setup dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            httr
            stringr
            rvest
            dplyr
            lubridate
            googlesheets4
          extra-repositories: https://packagemanager.posit.co/cran/latest
      # ------------------------------------------------------
      # RUN SCRAPER
      # ------------------------------------------------------
      - name: Run BAMIS WRF scraper
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GSHEET_JSON }}
        run: |
          Rscript weather_daily_forecast_bamis.R
