name: Update BAMIS Weather to Google Sheets

on:

  # Daily at 8:00 AM Bangladesh time
  schedule:
    - cron: "0 2 * * *"

  # Allows you to run manually
  workflow_dispatch:

jobs:

  update-weather:

    runs-on: ubuntu-latest

    steps:

      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup R
      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      # Install required packages
      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c(
            "rvest",
            "dplyr",
            "stringr",
            "lubridate",
            "googlesheets4",
            "jsonlite"
          ), repos="https://cloud.r-project.org")'

      # Run weather scraper
      - name: Download and append weather data
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          Rscript R/weather_daily_bamis.R
